apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
spec:
  selector:
    matchLabels:
      app: php-apache
  replicas: 1
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      # ✅ NO TOLERATIONS - Application pod intentionally lacks toleration for CriticalAddonsOnly taint
      # This ensures php-apache pods are REJECTED from System Nodes (protected by taint)
      # and are scheduled ONLY on Karpenter-managed nodes.
      #
      # Scheduler behavior:
      #   System Nodes (with taint: CriticalAddonsOnly=true:NoSchedule) → ❌ REJECTED
      #   Karpenter Nodes (no taints) → ✅ ACCEPTED
      #
      # If no Karpenter nodes exist, pods stay in "Pending" state until Karpenter provisions a new node (~30-60s).
      # This is the EXPECTED behavior - it triggers Karpenter's autoscaling feature.
      containers:
        - name: php-apache
          image: k8s.gcr.io/hpa-example
          ports:
            - containerPort: 80
          # resources: Section cruciale définissant les besoins en ressources de ce conteneur.
          resources:
            # requests: Les ressources minimales garanties pour le conteneur.
            # Kubernetes utilise cette valeur pour décider sur quel Node placer le Pod.
            requests:
              # cpu: 200m signifie 200 millicores CPU (soit 0.2 CPU core).
              # C'est la base de calcul pour le HPA (le "100%" dans le calcul de l'utilisation).
              cpu: 200m
            # limits: La limite absolue que le conteneur ne peut pas dépasser.
            # Si le conteneur tente d'utiliser plus de cette limite, il sera "throttled" (ralenti) ou arrêté (OOMKilled pour la mémoire).
            limits:
              # cpu: La limite CPU est fixée à 500 millicores (0.5 CPU core).
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
spec:
  type: ClusterIP
  selector:
    app: php-apache
  ports:
    - port: 80
      targetPort: 80
