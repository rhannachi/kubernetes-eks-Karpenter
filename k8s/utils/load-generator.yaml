apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  tolerations:
  - operator: "Exists"  # Tolère tous les taints
  containers:
  - name: load-generator
    image: busybox
    command:
    - /bin/sh
    - -c
    - |
      echo "🚀 Démarrage du générateur de charge pour php-apache"
      echo "🕒 Génération de charge continue sur http://php-apache"
      while true; do
        wget -q -O- http://php-apache
        sleep 1
      done
  restartPolicy: OnFailure