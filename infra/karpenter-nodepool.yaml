apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: microservices-general-ondemand
  namespace: karpenter
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: microservices-general-al2
  limits:
    cpu: "100"
  # 🛑 CONSOLIDATION DÉSACTIVÉE TEMPORAIREMENT POUR LE TEST
  # Cela empêche Karpenter de supprimer les nodes trop agressivement
  # Une fois le test terminé, réactivez avec les paramètres originaux:
  # disruption:
  #   consolidationPolicy: WhenEmptyOrUnderutilized
  #   consolidateAfter: 1m
  disruption:
    consolidationPolicy: WhenEmpty  # Seulement les nodes vraiment vides
    consolidateAfter: 10m           # Attendre 10min avant de consolider
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: microservices-general-al2
  namespace: karpenter
spec:
  role: "KarpenterNodeRole-microservices-demo-cluster"
  amiFamily: AL2
  amiSelectorTerms:
    - id: "ami-xxxxxxxxx"  # Remplacez par l'AMI ID réelle
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "microservices-demo-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "microservices-demo-cluster"
