# eks-cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: microservices-demo-cluster
  region: us-east-1
  version: "1.34"

vpc:
  cidr: 10.0.0.0/16

iam:
  # Nécessaire pour Karpenter (utilisation d'IRSA - IAM Roles for Service Accounts)
  withOIDC: true

managedNodeGroups:
  - name: karpenter-system-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2  # Pas d'autoscaling - ces nodes sont réservés pour Karpenter et les services système
    volumeSize: 40
    iam:
      withAddonPolicies:
        cloudWatch: true
        autoScaler: false  # Désactivé - Karpenter gère le scaling
    labels:
      role: system
      workload-type: system
    taints:
      - key: CriticalAddonsOnly
        value: "true"
        effect: NoSchedule
    tags:
      Name: "karpenter-system-node"
      karpenter.sh/discovery: "microservices-demo-cluster"  # Pour que Karpenter découvre les ressources VPC

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]
